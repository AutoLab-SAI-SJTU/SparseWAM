_target_: navsim.agents.drivoR.drivor_agent.DrivoRAgent

config:

  b2d: false # training for navsim

  shared_refiner: false
  ref_num: 4 # number of refining steps
  scorer_ref_num: 4

  proposal_num: 64 # number of proposals (trajectories)
  num_poses: 8 # size if the trajectories

  num_scene_tokens: 16 
  one_token_per_traj: true
  full_history_status: false

  # Front-only navtrain+val run. The launcher used to override this from -1 to 2.
  long_trajectory_additional_poses: 2

  noc: 1.0 
  dac: 1.0
  ddc: 0.0
  ttc: 5.0
  ep: 5.0
  comfort: 2.0

  tf_d_model: 256 # general feature size of the model
  tf_d_ffn: 1024 # hidden size of the heads

  ####################
  # sensor config
  # Front-only register space for navtrain+val training. Empty lists drop
  # that camera from both SensorConfig and the scene-token count, so scene
  # features are [B, num_cams * num_scene_tokens, tf_d_model] = [B, 1*16, 256]
  # instead of the 4-camera [B, 4*16, 256]. Decoder, scorer, and proposal
  # heads are unchanged. SimScale is not part of this config.
  cam_f0: [3]
  cam_l0: []
  cam_l1: []
  cam_l2: []
  cam_r0: []
  cam_r1: []
  cam_r2: []
  cam_b0: []
  lidar_pc: []


  ####################
  # image branch params
  image_size: [1148, 672] # input image size
  
  image_backbone:
    model_name: timm/vit_small_patch14_reg4_dinov2.lvd142m
    model_weights: weights/vit_small_patch14_reg4_dinov2.lvd142m/model.safetensors
    use_lora: true
    finetune: false
    lora_rank: 32
    focus_front_cam: false
    use_feature_pooling: false
    compress_fc: false


  # fov: [[-50., -50., -5.], [50., 50., 5.]] # simplebev field of view
  # voxel_grid: [100, 100, 8] # simple voxel grid size 
  # bev_encoder_conv_only: true # true, drop the classifier | false, classifier thus one scene vector

  #####################
  # Lidar branch params
  lidar_min_x: -35
  lidar_max_x: 35
  lidar_min_y: -35
  lidar_max_y: 35
  lidar_image_size: [518, 518] # input image size
  lidar_hist_max_per_pixel: 5
  lidar_max_height: 100.0
  lidar_split_height: 0.2
  lidar_use_ground_plane: true
  lidar_backbone:
    model_name: timm/vit_small_patch14_reg4_dinov2.lvd142m
    model_weights: weights/vit_small_patch14_reg4_dinov2.lvd142m/model.safetensors
    use_lora: true
    finetune: false
    lora_rank: 32
    in_chans: 2 # 2 if use ground plane, 1 otherwise


  ####################
  # scorer params
  double_score: false
  agent_pred: false
  area_pred: false
  bev_map: false
  bev_agent: false
  refiner_num_heads: 1
  refiner_ls_values: 0.0
  
  trajectory_sampling:
    _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
    time_horizon: 4
    interval_length: 0.5



loss:
  _target_: navsim.agents.drivoR.layers.losses.drivor_loss.DrivoRLoss
  trajectory_weight: 1.0
  inter_weight: 0.0
  sub_score_weight: 0.0
  final_score_weight: 1.0
  pred_ce_weight: 1.0
  pred_l1_weight: 0.1
  pred_area_weight: 2.0
  prev_weight: 0.0
  agent_class_weight: 1.0
  agent_box_weight: 0.1
  bev_semantic_weight: 1.0
  div_weight: 0.0


checkpoint_path: ''
lr_args: 
  name: AdamW
  # Launcher override. The 4-camera yaml default was 5e-4.
  base_lr: 0.0002
  base_batch_size: 64
scheduler_args: 
  num_epochs: ${trainer.params.max_epochs}
  # navtrain + val is about 103k scenes. 85000 ends the cosine early.
  dataset_size: 103000

batch_size: ${dataloader.params.batch_size}
num_gpus: 1 # scripts/training/train_drivor_front.sh overwrites this with NNODES * GPUS_PER_NODE

progress_bar: false # launcher override; print every 100 steps instead of a bar